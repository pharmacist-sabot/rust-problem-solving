name: Deploy mdBook to GitHub Pages

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup mdBook
        uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: "latest"

      - name: Validate SUMMARY.md structure
        run: |
          echo "Checking for legacy obXXX paths..."
          if grep -E "ob[0-9]+" src/SUMMARY.md; then
            echo "ERROR: Legacy obXXX paths found in SUMMARY.md"
            exit 1
          fi

          echo "Checking for tab indentation..."
          if grep -P "^\t" src/SUMMARY.md; then
            echo "ERROR: Use spaces, not tabs for indentation in SUMMARY.md"
            exit 1
          fi

          echo "Counting parts and chapters..."
          PART_COUNT=$(grep -c "^# Part\|^# Appendices" src/SUMMARY.md || true)
          CHAPTER_COUNT=$(grep -cE "^\s*- \[" src/SUMMARY.md || true)
          echo "Parts: $PART_COUNT"
          echo "Chapters: $CHAPTER_COUNT"

          echo "SUMMARY.md validation passed!"

      - name: Build Book
        run: |
          mdbook build

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "book"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
